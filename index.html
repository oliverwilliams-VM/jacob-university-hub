<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b2e"><title>Jacob's University Hub</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#17233a;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#101b2e;color:#e9efff;padding:26px 17px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:800;letter-spacing:-.6px;padding:8px 12px 28px}.brand small{display:block;font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:#a5b4d0;margin-top:5px}.nav{display:grid;gap:7px}.nav button{background:transparent;border:0;text-align:left;color:#b5c3d9;padding:13px 14px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:#263650;color:white}.sidefoot{position:absolute;bottom:22px;left:27px;font-size:12px;color:#9faec7}.main{padding:34px clamp(18px,4vw,62px);max-width:1500px;width:100%;margin:auto}.eyebrow{text-transform:uppercase;color:#5276a5;font-size:12px;font-weight:800;letter-spacing:1.6px}h1{font-size:clamp(27px,3vw,40px);margin:7px 0 9px;letter-spacing:-1.2px}h2{font-size:21px;margin:0 0 17px}h3{margin:0 0 9px;font-size:17px}p{color:#65718a;line-height:1.55}.top{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:27px}.pill{display:inline-flex;align-items:center;border-radius:50px;background:#e6f1ed;color:#197358;padding:6px 11px;font-size:12px;font-weight:750}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid #e4e9f2;border-radius:16px;padding:21px;box-shadow:0 4px 17px #14274606}.metric{font-size:31px;font-weight:800;letter-spacing:-1px;margin:9px 0 2px}.muted{color:#748199;font-size:13px}.section{margin-top:26px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.university{border-left:5px solid var(--accent);display:flex;flex-direction:column;gap:10px}.unihead{display:flex;align-items:center;justify-content:space-between;gap:10px}.unihead h3{margin:0}.rank{font-size:12px;font-weight:750;color:#60708b}.tag{background:#f0f3f9;border-radius:6px;padding:5px 8px;font-size:11px;color:#53637b;font-weight:750}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:auto}.btn{border:0;border-radius:9px;background:#244e88;color:white;padding:10px 14px;font-weight:700;font-size:13px}.btn.secondary{background:#edf2f9;color:#244e88}.btn.ghost{background:transparent;border:1px solid #dce3ee;color:#51627b}.btn.danger{background:#fae9e9;color:#a12e2e}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;color:#5b6980;font-weight:750}.field input,.field select,.field textarea{border:1px solid #d8e0eb;border-radius:9px;padding:11px;background:#fff;color:#1a2b46;width:100%;min-width:0}.field textarea{min-height:82px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #94b8ed}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.scoreline{display:grid;grid-template-columns:minmax(160px,1fr) 155px 50px;gap:12px;align-items:center;margin:12px 0}.scoreline input{accent-color:#285d9b;width:100%}.scoreline span{font-size:13px}.scoreline strong{text-align:right}.progress{height:9px;background:#eaf0f6;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#3a83bc;border-radius:8px}.tablewrap{overflow-x:auto}.data{width:100%;border-collapse:collapse;font-size:13px;min-width:650px}.data th{text-align:left;color:#68758b;background:#f5f7fb;padding:12px}.data td{border-bottom:1px solid #edf0f5;padding:12px}.data tr:last-child td{border:0}.data input{width:105px;border:1px solid #dce3ed;border-radius:7px;padding:8px}.data .wide{width:170px}.timeline{display:grid;gap:11px}.task{display:grid;grid-template-columns:22px 1fr auto;gap:13px;align-items:start;padding:13px;border:1px solid #e8edf5;border-radius:10px}.task input[type=checkbox]{accent-color:#20785d;width:17px;height:17px}.task.done{opacity:.58}.task.done strong{text-decoration:line-through}.task small{display:block;color:#748198;margin-top:5px}.task .date{font-size:12px;color:#5d6d86;white-space:nowrap}.note{border-left:3px solid #e3a53e;background:#fff9e9;padding:12px 15px;color:#796037;font-size:13px;border-radius:7px}.empty{padding:18px;background:#f5f7fa;border-radius:10px;color:#718098;font-size:13px}.hide{display:none!important}.footer{color:#8490a4;font-size:12px;margin:30px 0 10px}.header-actions{display:flex;gap:8px;flex-wrap:wrap}.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}.logo-dot{color:#79bfe9}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:720px){.shell{display:block}.sidebar{position:sticky;z-index:5;height:auto;padding:10px 12px}.brand{font-size:17px;padding:5px 7px 9px}.brand small,.sidefoot{display:none}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;padding:10px;font-size:12px}.main{padding:20px 14px}.top{display:block}.header-actions{margin-top:15px}.grid,.three,.cols{grid-template-columns:1fr}.scoreline{grid-template-columns:1fr 1fr 35px}.task{grid-template-columns:22px 1fr}.task .date{grid-column:2}.card{padding:17px}}
</style><style>
#authGate{position:fixed;inset:0;background:#f4f6fa;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}#authGate.hidden{display:none}#authPanel{max-width:430px;width:100%;background:white;border:1px solid #e4e9f2;border-radius:18px;padding:30px;box-shadow:0 20px 60px #14274615}#authPanel input{width:100%;padding:12px;border:1px solid #d8e0eb;border-radius:9px;margin:7px 0 15px}#syncStatus{font-size:12px;color:#b5c3d9;padding:10px 14px}#logout{background:#354763;color:white;border:0;border-radius:8px;padding:8px 12px;margin:8px 12px}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">J<span class="logo-dot">.</span> University Hub<small>Quantity Surveying · 2027</small></div><nav class="nav" id="nav"></nav><div id="syncStatus">Connecting…</div><div class="sidefoot">Jacob's next chapter ✦</div></aside><main class="main"><div id="app"></div><div class="footer">Public shared hub: anyone with the link can edit. Export backups regularly. University prices and dates must be verified before making decisions.</div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/config.js"></script><script>
const UNI=[{id:'uwe',name:'UWE Bristol',short:'UWE',color:'#db6550',role:'Current favourite',status:'Visited',location:'Bristol'},{id:'lboro',name:'Loughborough University',short:'Loughborough',color:'#8a68b4',role:'Aspirational',status:'Visit planned',location:'Loughborough'},{id:'ntu',name:'Nottingham Trent',short:'NTU',color:'#5c8eb7',role:'Strong contender',status:'Visit planned',location:'Nottingham'},{id:'reading',name:'University of Reading',short:'Reading',color:'#50a39b',role:'New contender',status:'To arrange',location:'Reading'},{id:'aston',name:'Aston University',short:'Aston',color:'#c69b43',role:'Insurance candidate',status:'To arrange',location:'Birmingham'}];
const CRITERIA=[['feeling','Overall feeling',25],['course','Course and teaching',20],['halls','Halls and accommodation',15],['social','Student life',15],['career','Placements and careers',15],['location','Location / getting home',5],['facilities','Facilities and support',5]];
const TASKS=[['2026-10-31','Confirm school UCAS internal deadline','Applications'],['2026-11-30','Visit Loughborough and complete scorecard','Visits'],['2026-11-30','Visit Nottingham Trent and complete scorecard','Visits'],['2026-12-05','Arrange University of Reading visit','Visits'],['2026-12-10','Compare five courses, RICS status and placement routes','Research'],['2026-12-15','Finish UCAS application and school reference process','Applications'],['2027-01-13','UCAS equal-consideration deadline — 18:00 UK','Applications'],['2027-02-28','Check student finance application opening and eligibility','Finance'],['2027-03-31','Attend offer-holder events and shortlist halls','Visits'],['2027-04-30','Compare firm and insurance offers and accommodation rules','Decisions'],['2027-05-31','Submit student finance application when available','Finance'],['2027-06-30','Confirm UCAS reply deadline shown in Hub','Decisions'],['2027-07-31','Create move-in budget and essentials list','Preparation'],['2027-08-31','Check results, offer confirmation and accommodation allocation','Decisions'],['2027-09-15','Finalise travel, enrolment and moving-in arrangements','Preparation']];
const DEFAULT=()=>({universities:Object.fromEntries(UNI.map(u=>[u.id,{scores:{},visited:u.id==='uwe',visitDate:'',notes:u.id==='uwe'?'Really liked the overall feel.':'',pros:'',cons:'',halls:'',questions:'',offer:'',offerStatus:'Not applied',courseLink:'',tuition:0,hallCost:0,hallWeeks:0,foodWeekly:65,socialWeekly:40,travelAnnual:500,otherAnnual:400,scholarship:0,finance:0,visitStatus:u.status}])),tasks:TASKS.map((t,i)=>({id:i,date:t[0],title:t[1],category:t[2],done:false})),customTasks:[],updated:''});
let data;try{data=JSON.parse(localStorage.getItem('jacob-university-hub-v1'))||DEFAULT()}catch{data=DEFAULT()}for(const u of UNI){data.universities[u.id]={...DEFAULT().universities[u.id],...(data.universities[u.id]||{})}}data.tasks ||= DEFAULT().tasks;data.customTasks ||= [];migrateReading(data);
function migrateReading(state){
 if(!state?.universities)return false;
 let changed=false;
 if(!state.universities.reading){
  state.universities.reading={...DEFAULT().universities.reading,courseLink:'https://www.reading.ac.uk/ready-to-study/study/subject-area/surveying-and-construction-management-ug/bsc-quantity-surveying',tuition:10050,notes:'2027 entry: BSc Quantity Surveying (K240); typical offer BBB; RICS accredited; optional industry placement. Verify before applying.'};changed=true;
 }
 if(state.universities.brookes){
  state.archivedUniversities ||= {};
  if(!state.archivedUniversities.brookes)state.archivedUniversities.brookes=state.universities.brookes;
  delete state.universities.brookes;changed=true;
 }
 for(const t of [...(state.tasks||[]),...(state.customTasks||[])]){
  if(typeof t.title==='string'&&t.title.includes('Oxford Brookes')){t.title=t.title.replaceAll('Oxford Brookes','University of Reading');changed=true}
 }
 return changed;
}
const save=()=>{data.updated=new Date().toISOString();localStorage.setItem('jacob-university-hub-v1',JSON.stringify(data));queueCloudSave()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'£'+Math.round(Number(n)||0).toLocaleString('en-GB');const score=id=>{let s=data.universities[id].scores;let answered=CRITERIA.filter(([k])=>Number(s[k])>0);return answered.length===CRITERIA.length?CRITERIA.reduce((sum,[k,,w])=>sum+Number(s[k])*w/100,0):null};const total=id=>{let d=data.universities[id],weeks=Number(d.hallWeeks)||42;return (+d.hallCost||0)+weeks*((+d.foodWeekly||0)+(+d.socialWeekly||0))+(+d.travelAnnual||0)+(+d.otherAnnual||0)-(+d.scholarship||0)};const viewTitle=(heading,sub,action='')=>`<div class="top"><div><div class="eyebrow">Jacob · 2027 entry · Predicted ABB</div><h1>${heading}</h1><p style="margin:0">${sub}</p></div>${action}</div>`;const navItems=[['dashboard','Overview'],['universities','Universities'],['visits','Visit scorecards'],['costs','Cost planner'],['timeline','Timeline'],['backup','Data & backup']];let page='dashboard',selected='uwe';const go=(p,id)=>{page=p;if(id)selected=id;render();window.scrollTo(0,0)};
function render(){document.getElementById('nav').innerHTML=navItems.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');document.getElementById('app').innerHTML=({dashboard,universities,visits,costs,timeline,backup})[page]();}
function dashboard(){let scored=UNI.filter(u=>score(u.id)!==null).length,done=[...data.tasks,...data.customTasks].filter(t=>t.done).length,all=[...data.tasks,...data.customTasks].length;return viewTitle('The road to university','One place for every visit, decision, cost and deadline.',`<span class="pill">2027 intake</span>`)+`<div class="grid"><div class="card"><div class="muted">Universities shortlisted</div><div class="metric">5</div><div class="muted">Quantity Surveying pathways</div></div><div class="card"><div class="muted">Visits completed</div><div class="metric">${UNI.filter(u=>data.universities[u.id].visited).length}/5</div><div class="muted">UWE already visited</div></div><div class="card"><div class="muted">Full scorecards</div><div class="metric">${scored}/5</div><div class="muted">7 weighted categories</div></div><div class="card"><div class="muted">Tasks complete</div><div class="metric">${done}/${all}</div><div class="progress"><div style="width:${all?done/all*100:0}%"></div></div></div></div><div class="section two"><div class="card"><h2>The shortlist</h2><div class="three" style="grid-template-columns:repeat(auto-fit,minmax(155px,1fr))">${UNI.map(u=>`<div style="border-top:4px solid ${u.color};padding:12px 5px"><strong>${u.short}</strong><div class="muted" style="margin:7px 0">${u.role}</div><div style="font-size:12px;margin-bottom:12px">${score(u.id)===null?'Not scored':score(u.id).toFixed(2)+' / 5'}</div><button class="btn secondary" onclick="go('visits','${u.id}')">Open profile</button></div>`).join('')}</div></div><div class="card"><h2>Next steps</h2>${[...data.tasks,...data.customTasks].filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(t=>`<div style="padding:10px 0;border-bottom:1px solid #edf0f5"><strong style="font-size:13px">${esc(t.title)}</strong><div class="muted">${esc(t.date)} · ${esc(t.category)}</div></div>`).join('')}<div style="margin-top:15px"><button class="btn secondary" onclick="go('timeline')">Full timeline →</button></div></div></div><div class="section card"><h2>Current benchmark: UWE Bristol</h2><p>Jacob loved the overall feel of UWE. Use it as the reference point after visiting Loughborough, Nottingham Trent and Reading.</p><div class="note">Scores are only calculated after all seven categories have been completed. Cost figures are editable planning assumptions, not verified 2027/28 quotes.</div></div>`}
function universities(){return viewTitle('The five universities','The working UCAS shortlist — profiles, offers and course links.')+`<div class="three">${UNI.map(u=>{let d=data.universities[u.id];return `<div class="card university" style="--accent:${u.color}"><div class="unihead"><h3>${u.name}</h3><span class="tag">${u.role}</span></div><div class="muted">${u.location} · ${esc(d.visitStatus)}</div><div><strong>${score(u.id)===null?'Awaiting visit score':score(u.id).toFixed(2)+' / 5'}</strong></div><div class="field"><label>Application / offer status</label><select onchange="setUni('${u.id}','offerStatus',this.value)">${['Not applied','Applied','Offer received','Conditional offer','Unconditional offer','Rejected','Firm','Insurance','Withdrawn'].map(v=>`<option ${d.offerStatus===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Offer conditions / requirements</label><input value="${esc(d.offer)}" placeholder="e.g. BBC — confirm from offer" onchange="setUni('${u.id}','offer',this.value)"></div><div class="field"><label>Official course URL</label><input value="${esc(d.courseLink)}" placeholder="Paste verified course page" onchange="setUni('${u.id}','courseLink',this.value)"></div><div class="actions"><button class="btn" onclick="go('visits','${u.id}')">Review university</button><button class="btn secondary" onclick="go('costs')">Costs</button>${/^https?:\/\//.test(d.courseLink)?`<a class="btn ghost" target="_blank" rel="noopener" href="${esc(d.courseLink)}">Course page ↗</a>`:''}</div></div>`}).join('')}</div>`}
function visits(){let u=UNI.find(u=>u.id===selected),d=data.universities[selected];return viewTitle('Open-day scorecard','Jacob should complete this immediately after each visit.')+`<div class="card" style="margin-bottom:18px"><div class="toolbar">${UNI.map(x=>`<button class="btn ${selected===x.id?'':'secondary'}" onclick="go('visits','${x.id}')">${x.short}</button>`).join('')}</div></div><div class="two"><div class="card"><div class="unihead"><h2>${u.name}</h2><span class="tag">${u.role}</span></div><div class="cols"><div class="field"><label>Visit date</label><input type="date" value="${esc(d.visitDate)}" onchange="setUni('${u.id}','visitDate',this.value)"></div><div class="field"><label>Visit status</label><select onchange="setUni('${u.id}','visitStatus',this.value)">${['To arrange','Booked','Visit planned','Visited','Revisit needed'].map(x=>`<option ${d.visitStatus===x?'selected':''}>${x}</option>`).join('')}</select></div></div><label style="font-size:13px;font-weight:700"><input type="checkbox" ${d.visited?'checked':''} onchange="setUni('${u.id}','visited',this.checked)"> Visit completed</label><h3 style="margin-top:23px">Rate each area from 1 to 5</h3><p style="font-size:13px">1 = poor · 3 = good · 5 = outstanding</p>${CRITERIA.map(([k,label,w])=>`<div class="scoreline"><span>${label} <small class="muted">(${w}%)</small></span><input type="range" min="0" max="5" step="1" value="${d.scores[k]||0}" oninput="setScore('${u.id}','${k}',this.value)"><strong>${d.scores[k]||'—'}/5</strong></div>`).join('')}<div style="margin-top:20px;background:#edf4fa;border-radius:12px;padding:16px"><div class="muted">Weighted overall score</div><div class="metric">${score(u.id)===null?'Incomplete':score(u.id).toFixed(2)+' / 5'}</div></div></div><div class="card"><h2>Capture the feeling</h2>${[['notes','First impression — can I picture myself here?'],['pros','Three things I loved'],['cons','Things I was unsure about'],['halls','Favourite halls / rooms'],['questions','Questions to follow up']].map(([k,l])=>`<div class="field"><label>${l}</label><textarea placeholder="Write it while the visit is fresh..." onchange="setUni('${u.id}','${k}',this.value)">${esc(d[k])}</textarea></div>`).join('')}<div class="note">Questions for the QS department: How many students secure a 12-month placement? Which employers recruited last year? Is the exact course RICS-accredited for the intake? How are placements supported?</div></div></div>`}
function costs(){return viewTitle('True cost of university','Edit the assumptions and compare the estimated first-year cost of each choice.')+`<div class="card"><div class="note" style="margin-bottom:17px">Tuition is shown separately because it is normally covered by a tuition-fee loan for eligible students. Halls prices, contract weeks and maintenance funding must be entered from official offers; £0 means not yet entered.</div><div class="tablewrap"><table class="data"><thead><tr><th>University</th><th>Tuition / year</th><th>Halls / contract</th><th>Contract weeks</th><th>Food / week</th><th>Social / week</th><th>Travel / year</th><th>Other / year</th><th>Scholarships / year</th><th>Maintenance funding / year</th></tr></thead><tbody>${UNI.map(u=>{let d=data.universities[u.id];return `<tr><td><strong>${u.short}</strong></td>${[['tuition',''],['hallCost',''],['hallWeeks',''],['foodWeekly',''],['socialWeekly',''],['travelAnnual',''],['otherAnnual',''],['scholarship',''],['finance','']].map(([k])=>`<td><input aria-label="${u.short} ${k}" type="number" min="0" value="${d[k]}" onchange="setUni('${u.id}','${k}',Number(this.value))"></td>`).join('')}</tr>`}).join('')}</tbody></table></div></div><div class="section grid">${UNI.map(u=>{let d=data.universities[u.id];return `<div class="card" style="border-top:4px solid ${u.color}"><div class="muted">${u.short} · annual living estimate</div><div class="metric">${money(total(u.id))}</div><div class="muted">Before maintenance funding</div><div style="margin-top:12px"><strong>Funding gap: ${money(total(u.id)-(+d.finance||0))}</strong></div><div class="muted" style="margin-top:7px">Tuition ${money(d.tuition)} separately</div></div>`}).join('')}</div><div class="section card"><h2>How these figures are calculated</h2><p>Living estimate = halls contract + (food + social allowance) × contract weeks + travel + other spending − scholarships. Funding gap = living estimate − expected maintenance funding. This is a first-year planning estimate, not a full 52-week budget. Placement-year costs and accommodation will be different.</p></div>`}
function timeline(){let all=[...data.tasks,...data.customTasks].sort((a,b)=>a.date.localeCompare(b.date));return viewTitle('Application timeline','Track every action from open days to moving into halls.')+`<div class="two"><div class="card"><h2>Milestones and tasks</h2><div class="note" style="margin-bottom:17px">Only the 13 January 2027 UCAS equal-consideration deadline is treated here as an official date. All other dates are suggested planning targets and must be checked against school, UCAS, student finance and university communications.</div><div class="timeline">${all.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}',this.checked)"><div><strong>${esc(t.title)}</strong><small>${esc(t.category)}</small></div><span class="date">${esc(t.date)}</span></div>`).join('')}</div></div><div class="card"><h2>Add a task</h2><div class="field"><label>What needs doing?</label><input id="newTitle" placeholder="e.g. Book NTU open day"></div><div class="field"><label>Target date</label><input id="newDate" type="date"></div><div class="field"><label>Category</label><select id="newCategory"><option>Visits</option><option>Applications</option><option>Research</option><option>Finance</option><option>Decisions</option><option>Preparation</option></select></div><button class="btn" onclick="addTask()">Add task</button><h3 style="margin-top:28px">Official sources to check</h3><p><a href="https://www.ucas.com/" target="_blank" rel="noopener">UCAS</a> — application, offers and reply dates</p><p><a href="https://www.gov.uk/student-finance" target="_blank" rel="noopener">Student Finance England</a> — finance opening and deadlines</p><p><a href="https://www.gov.uk/government/organisations/ofqual" target="_blank" rel="noopener">Ofqual</a> — results and exams information</p></div></div>`}
function backup(){return viewTitle('Your data & backups','Keep a copy of Jacob’s progress and move it between devices.')+`<div class="two"><div class="card"><h2>Save a backup</h2><p>Download everything: scores, notes, university offers, budgets and tasks. Keep the JSON file somewhere safe.</p><button class="btn" onclick="exportData()">Download data backup ↓</button><h2 style="margin-top:29px">Restore / move to another device</h2><p>Open the hub on the other device, then import the latest backup. Importing replaces that device’s saved data.</p><label class="btn secondary filebtn">Import JSON backup <input type="file" accept=".json,application/json" onchange="importData(this.files[0])"></label></div><div class="card"><h2>How saving works</h2><p>Changes save locally and sync to the public shared database. Check the sync indicator before closing the page.</p><div class="note">Don't use private/incognito mode for important notes. Export a backup after each visit. Anyone with the website link can edit the shared data. Export backups regularly.</div><p style="margin-top:18px">Last saved: ${data.updated?new Date(data.updated).toLocaleString('en-GB'):'Not yet saved'}</p><button class="btn danger" onclick="resetData()">Reset all local data</button></div></div>`}
function setUni(id,key,value){data.universities[id][key]=value;save();render()}function setScore(id,key,value){data.universities[id].scores[key]=Number(value);save();render()}function toggleTask(id,value){let t=[...data.tasks,...data.customTasks].find(x=>String(x.id)===String(id));if(t){t.done=value;save();render()}}function addTask(){let title=document.getElementById('newTitle').value.trim(),date=document.getElementById('newDate').value,category=document.getElementById('newCategory').value;if(!title||!date){alert('Enter a task and target date.');return}data.customTasks.push({id:'c'+Date.now(),title,date,category,done:false});save();render()}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jacob-university-hub-backup.json';a.click();URL.revokeObjectURL(a.href)}async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!d.universities||!Array.isArray(d.tasks))throw Error('Invalid backup');if(!confirm('Replace this browser’s saved data with the imported backup?'))return;data=d;migrateReading(data);for(const u of UNI)data.universities[u.id]={...DEFAULT().universities[u.id],...(data.universities[u.id]||{})};data.customTasks||=[];save();render();alert('Backup imported successfully.')}catch(e){alert('Could not import: '+e.message)}}function resetData(){if(confirm('Delete all saved scores, notes, costs and tasks in this browser?')){data=DEFAULT();save();render()}}render();
// Public, no-login shared state. Supabase RLS grants anonymous access ONLY to hub_public_state.
let db=null,cloudReady=false,syncTimer=null,syncBusy=false,dirty=false;
function syncText(message){document.getElementById('syncStatus').textContent=message}
function queueCloudSave(){dirty=true;if(!cloudReady){syncText('Not connected — changes saved on this device');return}syncText('Unsaved changes…');clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,800)}
async function pushCloud(){
 if(!cloudReady||syncBusy||!dirty)return;
 syncBusy=true;dirty=false;syncText('Saving…');
 try{
  const result=await db.from('hub_public_state').update({state:data,updated_at:new Date().toISOString()}).eq('id',1).select('id');
  if(result.error)throw result.error;
  if(!result.data?.length)throw Error('Public hub row missing — run setup SQL');
  syncText('Saved to cloud ✓');
 }catch(e){dirty=true;syncText('Cloud save failed — export backup');console.error('Cloud save error',e)}
 finally{syncBusy=false;if(dirty&&cloudReady){clearTimeout(syncTimer);syncTimer=setTimeout(pushCloud,1600)}}
}
async function initializeCloud(){
 const cfg=window.JACOB_SUPABASE||{};
 if(!cfg.url||!cfg.publishableKey||cfg.publishableKey.includes('PASTE_')){syncText('Cloud not configured — check config.js');return}
 if(!window.supabase){syncText('Supabase library failed to load');return}
 db=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
 const result=await db.from('hub_public_state').select('state').eq('id',1).maybeSingle();
 if(result.error)throw result.error;
 if(!result.data)throw Error('Shared database row not found. Run setup SQL.');
 const state=result.data.state;
 let migrated=false;
 if(state?.universities&&Array.isArray(state.tasks)){
  data=state;
  migrated=migrateReading(data);
  for(const u of UNI)data.universities[u.id]={...DEFAULT().universities[u.id],...(data.universities[u.id]||{})};
  data.customTasks||=[];
  localStorage.setItem('jacob-university-hub-v1',JSON.stringify(data));
 }
 cloudReady=true;syncText(state?.universities?'Loaded from cloud ✓':'Connected — ready to save');render();if(typeof migrated!=='undefined'&&migrated)save();
}
initializeCloud().catch(e=>{syncText('Cloud connection failed — see console');console.error('Cloud connection error',e)});
</script></body></html>
